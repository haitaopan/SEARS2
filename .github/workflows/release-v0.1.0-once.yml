name: Publish SEARS2 v0.1.0 release once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists; nothing to do."
            exit 0
          fi
          gh release create v0.1.0 \
            --target 92c04ea7dcecb1347a9218f4a722b186c037df92 \
            --title "SEARS2 v0.1.0" \
            --notes "Initial public GitHub release of SEARS 2.0. Includes the decision-specific evidence-authority API, four-state dose-decision mapping, frozen manuscript defaults/scenarios, tests, documentation, vignettes, and lightweight comparative-stage simulation. R CMD check --as-cran: OK; 54 tests passed. CRAN submission is deferred pending external manuscript review and API stabilization."
